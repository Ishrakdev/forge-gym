<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Booking | FORGE</title>
    <link rel="icon" href="assets/icons/favicon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="booking-page">

    <header class="main-header">
        <div class="logo">FORGE.</div>
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="schedule.html">Back to Schedule</a>
        </nav>
    </header>

    <div class="dynamic-bg"></div>

    <main class="booking-main">
        <div class="booking-container glass-card">
            <!-- Dynamic Header -->
            <div class="booking-header">
                <span class="theme-indicator" id="theme-label">CLASS BOOKING</span>
                <h1 id="class-title">Class Name</h1>
                <p id="class-time">Time</p>
            </div>

            <form id="booking-form" class="booking-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="+1 (555) 000-0000" required>
                </div>
                <button type="submit" class="btn-submit">Confirm Reservation</button>
            </form>

            <!-- Success Message (Hidden by default) -->
            <div id="success-msg" class="success-msg" style="display: none;">
                <h2>Reservation Confirmed!</h2>
                <p>We've saved your spot. A confirmation email is on its way.</p>
                <a href="schedule.html" class="btn-submit" style="display:inline-block; text-align:center; margin-top: 2rem;">Back to Schedule</a>
            </div>
        </div>
    </main>

    <script src="js/booking.js"></script>
</body>
</html>
